name: dbt Daily Run

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily — adjust to run after your Cloud Function completes
  workflow_dispatch: {}     # lets you trigger it manually too, for testing

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Create GCP credentials file
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt build
        run: dbt build --target prod