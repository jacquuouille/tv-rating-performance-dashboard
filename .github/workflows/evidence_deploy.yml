name: evidence_deploy

on:
  workflow_run:
    workflows: ["dbt_stg_ci"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reports

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Extract BigQuery credentials from service account key
        env:
          GCP_KEY_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "EVIDENCE_SOURCE__tv_performance__authenticator=service-account" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__location=US" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__client_email=$(echo "$GCP_KEY_JSON" | jq -r .client_email)" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__project_id=$(echo "$GCP_KEY_JSON" | jq -r .project_id)" >> "$GITHUB_ENV"
          {
            echo "EVIDENCE_SOURCE__tv_performance__private_key<<PKEOF"
            echo "$GCP_KEY_JSON" | jq -r .private_key
            echo "PKEOF"
          } >> "$GITHUB_ENV"

      - name: Build Evidence site
        run: |
          npm run sources
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./reports/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4