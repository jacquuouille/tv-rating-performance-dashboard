name: evidence_deploy

on:
  workflow_run:
    workflows: ["dbt_stg_ci"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reports

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Extract BigQuery credentials from service account key
        run: |
          echo "EVIDENCE_SOURCE__tv_performance__authenticator=service-account" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__location=US" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__client_email=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | jq -r .client_email)" >> "$GITHUB_ENV"
          echo "EVIDENCE_SOURCE__tv_performance__project_id=$(echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | jq -r .project_id)" >> "$GITHUB_ENV"
          {
            echo "EVIDENCE_SOURCE__tv_performance__private_key<<EOF"
            echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' | jq -r .private_key
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Evidence site
        run: |
          npm run sources
          npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './reports/build'
          production-deploy: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}